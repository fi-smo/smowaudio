[package]
name = "smowaudio"
version = "0.9.4"
edition = "2021"
description = "Lightweight audio mixer with virtual mic processing"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
rtrb = "0.3"
parking_lot = "0.12"
winreg = "0.55"
ndarray = "0.16"
# Official libDF vendored with a 5-line port to current tract + ndarray 0.16; see vendor/DeepFilterNet/VENDORED.md.
deep_filter = { path = "vendor/DeepFilterNet/libDF", default-features = false, features = ["tract", "default-model"] }

# The #[interface] macro expands to `::windows_core` paths.
windows-core = "0.62"
# The tray icon and its menu, and global keyboard shortcuts.
tray-icon = "0.24"
global-hotkey = "0.8"
png = "0.17"
# Updates: latest.json and the installer from GitHub, checked against the release signing key.
ureq = "3"
minisign-verify = "0.2"
base64 = "0.22"
semver = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }

[dev-dependencies]
# Signs release installers (examples/sign_update.rs) the way Tauri's CLI did.
minisign = "0.7"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_System_WinRT",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Security",
  "Win32_System_Pipes",
  "Win32_System_IO",
]

# Neural network inference is unusably slow unoptimized, even in dev builds.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Our own DSP (resampler, EQ, limiter) runs every few milliseconds; keep it fast in dev builds too,
# so a slow write can't push a virtual cable into its high-latency mode.
# Full debug info plus incremental caches grew target\debug past 20 GB; line tables are enough
# for panic backtraces.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
# 16 units (Rust's default) rebuild 2.5x faster than 1; noise removal measured just as fast.
codegen-units = 16
strip = true
