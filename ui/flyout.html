<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smowaudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="flyout-body">
  <div class="flyout">
    <div class="fly-head">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <b>Smowaudio</b>
      <span class="spacer"></span>
      <span class="dot" id="fly-status" title="All streams running"></span>
    </div>
    <div class="fly-dev">
      <button type="button" class="fly-dev-btn" id="fly-output-btn" aria-expanded="false" aria-controls="fly-output-list">
        <span>Output</span><b id="fly-output">…</b>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </button>
      <div class="fly-dev-list" id="fly-output-list" role="listbox" aria-label="Output device" hidden></div>
    </div>
    <div class="fly-rows" id="fly-rows"></div>
    <div class="fly-mic">
      <span class="tape">Mic</span>
      <button type="button" class="btn mute" id="fly-mute" aria-pressed="false">Mute</button>
      <label class="switch"><input type="checkbox" id="fly-listen"><span class="track"></span>Listen</label>
    </div>
    <div class="fly-foot">
      <button type="button" class="btn primary" data-open="mixer">Open mixer</button>
      <button type="button" class="btn" data-open="settings">Settings</button>
    </div>
  </div>
  <script src="flyout.js"></script>
</body>
</html>
