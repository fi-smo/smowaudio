<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smowaudio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="flyout-body">
  <div class="flyout">
    <div class="fly-head">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <b>Smowaudio</b>
      <span class="spacer"></span>
      <button type="button" class="fly-status" id="fly-status" title="Open Settings → Devices"><span class="dot"></span><span id="fly-status-text">Starting</span></button>
    </div>
    <div class="fly-dev">
      <button type="button" class="fly-dev-btn" id="fly-output-btn" aria-expanded="false" aria-controls="fly-output-list">
        <svg class="fly-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><rect x="2" y="9.5" width="3" height="4.5" rx="1"/><rect x="11" y="9.5" width="3" height="4.5" rx="1"/></svg>
        <span>Output</span><b id="fly-output">…</b>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </button>
      <div class="fly-dev-list" id="fly-output-list" role="listbox" aria-label="Output device" hidden></div>
    </div>
    <div class="fly-panel" id="fly-rows"></div>
    <div class="fly-panel fly-mic" id="fly-mic">
      <span class="tape" style="--c: var(--mic)">Mic</span>
      <div class="fly-mic-state">
        <span id="fly-mic-text">…</span>
        <span class="fly-level" aria-hidden="true"><i id="fly-mic-level"></i></span>
      </div>
      <div class="fly-mic-btns">
        <button type="button" class="btn mute" id="fly-mute" aria-pressed="false">
          <svg class="fly-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5V15"/></svg>
          Mute
        </button>
        <button type="button" class="btn listen" id="fly-listen" aria-pressed="false">
          <svg class="fly-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><rect x="2" y="9.5" width="3" height="4.5" rx="1"/><rect x="11" y="9.5" width="3" height="4.5" rx="1"/></svg>
          Listen
        </button>
      </div>
    </div>
    <div class="fly-foot">
      <button type="button" class="btn fly-open" data-open="mixer">Open mixer</button>
      <button type="button" class="btn fly-gear" data-open="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path stroke-linejoin="round" d="M10.21 5.34L10.50 2.52L13.50 2.52L13.79 5.34L15.45 6.02L17.64 4.23L19.77 6.36L17.98 8.55L18.66 10.21L21.48 10.50L21.48 13.50L18.66 13.79L17.98 15.45L19.77 17.64L17.64 19.77L15.45 17.98L13.79 18.66L13.50 21.48L10.50 21.48L10.21 18.66L8.55 17.98L6.36 19.77L4.23 17.64L6.02 15.45L5.34 13.79L2.52 13.50L2.52 10.50L5.34 10.21L6.02 8.55L4.23 6.36L6.36 4.23L8.55 6.02Z"/></svg>
      </button>
    </div>
  </div>
  <script src="flyout.js"></script>
</body>
</html>
