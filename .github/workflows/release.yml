# Releases the version in Cargo.toml when it changes on main: builds a signed installer, publishes
# it as GitHub Release vX.Y.Z (creating the tag) and writes latest.json to the `updates` branch,
# which the app reads to offer the update. Pushes that don't change the version stop after a few
# seconds.
# Runs on main rather than on tags because GitHub only shares build caches within a branch (or
# from main): tag builds each started from scratch (~22 min instead of a few).
# Only the repo's own GITHUB_TOKEN is needed; the signing key is the TAURI_SIGNING_PRIVATE_KEY secret
# (named after the tool that first made it; the app checks installers against its public half).
name: Release

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find the version to release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The [package] version: the first `version = "..."` line in Cargo.toml.
          $version = ([regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if (-not $version) { throw "No version in Cargo.toml" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "v$version is already released; nothing to do."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "skip=false" >> $env:GITHUB_OUTPUT

          # Notes come from CHANGELOG.md (newest version first), checked here so a missing section
          # fails in seconds rather than after the build. The release gets this version's section;
          # latest.json gets the last few, so the app can show everything an update brings.
          $sections = [regex]::Split((Get-Content CHANGELOG.md -Raw), '(?m)^(?=## )') | Where-Object { $_ -match '^## ' }
          $mine = $sections | Where-Object { $_ -match "^## v?$([regex]::Escape($version))\s" } | Select-Object -First 1
          if (-not $mine) { throw "CHANGELOG.md has no '## $version' section" }
          ($mine -replace '^## [^\r\n]*\r?\n', '').Trim() | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          (($sections | Select-Object -First 10) -join "`n").Trim() | Set-Content "$env:RUNNER_TEMP/update-notes.md" -Encoding utf8
          exit 0

      # Real-time scanning of every file the compiler writes slows Windows builds a lot. This is
      # GitHub's throwaway build machine, not anyone's PC.
      - name: Turn off Defender scanning on the build machine
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip == 'false'

      # The noise-removal engine takes most of the build; caching it cuts later builds a lot.
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip == 'false'
        with:
          shared-key: release

      - name: Build the app
        if: steps.version.outputs.skip == 'false'
        run: cargo build --release

      - name: Build the installer
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing NSIS failed" }
          }
          & $makensis -V2 "-DVERSION=$env:VERSION" "-DOUTFILE=..\target\Smowaudio_${env:VERSION}_x64-setup.exe" installer/smowaudio.nsi
          if ($LASTEXITCODE -ne 0) { throw "Building the installer failed" }

      - name: Sign the installer
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        env:
          SMOWAUDIO_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cargo run --release --example sign_update -- "target/Smowaudio_${env:VERSION}_x64-setup.exe" $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }

      - name: Publish the release and the update manifest
        if: steps.version.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:TAG
          $setup = Get-Item "target/Smowaudio_${env:VERSION}_x64-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "The installer wasn't built" }
          $signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()

          gh release create $tag $setup.FullName --target $env:GITHUB_SHA --title "Smowaudio $env:VERSION" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed" }

          # The app downloads through the API (the repo is private), so it needs the asset's API URL.
          $release = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -eq $setup.Name } | Select-Object -First 1
          $manifest = [ordered]@{
            version   = $env:VERSION
            notes     = (Get-Content "$env:RUNNER_TEMP/update-notes.md" -Raw).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $signature; url = $asset.url } }
          } | ConvertTo-Json -Depth 5

          gh api "repos/$repo/branches/updates" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/heads/updates -f sha=$env:GITHUB_SHA --silent
          }
          $body = @{
            message = "Update manifest for $tag"
            content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
            branch  = "updates"
          }
          $existing = gh api "repos/$repo/contents/latest.json?ref=updates" --jq .sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) { $body.sha = $existing.Trim() }
          $body | ConvertTo-Json | gh api -X PUT "repos/$repo/contents/latest.json" --input - --silent
          if ($LASTEXITCODE -ne 0) { throw "Writing latest.json failed" }
          "Published $tag"
